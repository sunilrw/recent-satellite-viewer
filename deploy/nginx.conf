proxy_cache_path /var/cache/nginx/geocode levels=1:2 keys_zone=geocode:10m max_size=100m inactive=7d;
limit_req_zone $binary_remote_addr zone=geo:10m rate=1r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok"; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Self-hosted TiTiler (compose service "titiler").
  location /tiler/ {
    resolver 127.0.0.11 valid=30s;
    set $titiler http://titiler:80;
    rewrite ^/tiler/(.*)$ /$1 break;
    proxy_pass $titiler;
    proxy_read_timeout 60s;
    proxy_cache_valid 200 1h;
  }

  # Geocoder proxy: sends the identifying User-Agent Nominatim requires,
  # caches answers and keeps us under 1 request per second.
  location /geocode/ {
    limit_req zone=geo burst=5 nodelay;
    rewrite ^/geocode/(.*)$ /$1 break;
    proxy_pass https://nominatim.openstreetmap.org;
    proxy_ssl_server_name on;
    proxy_set_header Host nominatim.openstreetmap.org;
    proxy_set_header User-Agent "RecentSatelliteViewer/1.1 (self-hosted)";
    proxy_cache geocode;
    proxy_cache_valid 200 7d;
    proxy_cache_key "$request_uri";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
